<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img"><defs><style>.up{animation:ua .8s cubic-bezier(.2,.7,.2,1) both}@keyframes ua{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.up{animation:none}}</style><linearGradient id="ag" x1="0" x2="1"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><pattern id="ad" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1b2a4a"/></pattern></defs><rect width="900" height="370" rx="24" fill="#070b16"/><rect width="900" height="370" rx="24" fill="url(#ad)"/><rect x="1" y="1" width="898" height="368" rx="23" fill="none" stroke="url(#ag)" stroke-opacity=".55" stroke-width="2"/><rect x="40" y="40" width="390" height="290" rx="20" fill="#0f1a30" stroke="#1f3460"/><rect x="460" y="40" width="400" height="290" rx="20" fill="#0f1a30" stroke="#1f3460"/>
<text x="70" y="82" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="13" fill="#247bff" letter-spacing="3">WHAT I DO</text><g class="up" style="animation-delay:0.2s"><text x="70" y="128" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="14" fill="#ff354f">01</text><text x="108" y="126" font-family="'Barlow Condensed','Arial Narrow','Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" fill="#f4f6ff">Business Development</text><text x="108" y="144" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="11" fill="#9aa6c1">Finding and growing opportunities</text></g><g class="up" style="animation-delay:0.35s"><text x="70" y="178" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="14" fill="#ff354f">02</text><text x="108" y="176" font-family="'Barlow Condensed','Arial Narrow','Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" fill="#f4f6ff">Client Relationships</text><text x="108" y="194" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="11" fill="#9aa6c1">Building trust that lasts</text></g><g class="up" style="animation-delay:0.5s"><text x="70" y="228" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="14" fill="#ff354f">03</text><text x="108" y="226" font-family="'Barlow Condensed','Arial Narrow','Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" fill="#f4f6ff">Sales Strategy</text><text x="108" y="244" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="11" fill="#9aa6c1">Turning plans into results</text></g><g class="up" style="animation-delay:0.6499999999999999s"><text x="70" y="278" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="14" fill="#ff354f">04</text><text x="108" y="276" font-family="'Barlow Condensed','Arial Narrow','Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" fill="#f4f6ff">Python Programming</text><text x="108" y="294" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="11" fill="#9aa6c1">Learning by building projects</text></g>
<text x="490" y="82" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="13" fill="#ff354f" letter-spacing="3">OUTSIDE WORK</text><g opacity="1"><text x="500" y="170" font-family="'Barlow Condensed','Arial Narrow','Segoe UI',Arial,sans-serif" font-size="72" font-weight="800" fill="#247bff" opacity=".35">01</text><text x="500" y="222" font-family="'Barlow Condensed','Arial Narrow','Segoe UI',Arial,sans-serif" font-size="40" font-weight="800" fill="#f4f6ff">TRAVELING</text><text x="500" y="256" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="13" fill="#9aa6c1">Exploring new places, cultures and people.</text><animate attributeName="opacity" calcMode="discrete" values="1;0;0" keyTimes="0;.3333;.6667" dur="12s" repeatCount="indefinite"/></g><g opacity="0"><text x="500" y="170" font-family="'Barlow Condensed','Arial Narrow','Segoe UI',Arial,sans-serif" font-size="72" font-weight="800" fill="#247bff" opacity=".35">02</text><text x="500" y="222" font-family="'Barlow Condensed','Arial Narrow','Segoe UI',Arial,sans-serif" font-size="40" font-weight="800" fill="#f4f6ff">BOOK READING</text><text x="500" y="256" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="13" fill="#9aa6c1">Learning something new from every page.</text><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;.3333;.6667" dur="12s" repeatCount="indefinite"/></g><g opacity="0"><text x="500" y="170" font-family="'Barlow Condensed','Arial Narrow','Segoe UI',Arial,sans-serif" font-size="72" font-weight="800" fill="#247bff" opacity=".35">03</text><text x="500" y="222" font-family="'Barlow Condensed','Arial Narrow','Segoe UI',Arial,sans-serif" font-size="40" font-weight="800" fill="#f4f6ff">CODING</text><text x="500" y="256" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="13" fill="#9aa6c1">Building small Python projects, one step at a time.</text><animate attributeName="opacity" calcMode="discrete" values="0;0;1" keyTimes="0;.3333;.6667" dur="12s" repeatCount="indefinite"/></g><rect x="490" y="320" width="115" height="5" rx="2.5" fill="#1b2a4a"/><rect x="490" y="320" width="115" height="5" rx="2.5" fill="url(#ag)"><animate attributeName="width" values="0;0;115;115" keyTimes="0;0.0000;0.3333;1" dur="12s" repeatCount="indefinite"/></rect><rect x="615" y="320" width="115" height="5" rx="2.5" fill="#1b2a4a"/><rect x="615" y="320" width="0" height="5" rx="2.5" fill="url(#ag)"><animate attributeName="width" values="0;0;115;115" keyTimes="0;0.3333;0.6667;1" dur="12s" repeatCount="indefinite"/></rect><rect x="740" y="320" width="115" height="5" rx="2.5" fill="#1b2a4a"/><rect x="740" y="320" width="0" height="5" rx="2.5" fill="url(#ag)"><animate attributeName="width" values="0;0;115;115" keyTimes="0;0.6667;1.0000;1" dur="12s" repeatCount="indefinite"/></rect></svg>